{{- /*
  Mascotte Ananse : petite araignée ronde et sympa.
  Paramètres : id (unique dans la page), pose ("salut", "ordi", "loupe", "telephone"), classe (CSS).
*/ -}}
{{- $id := .id | default "m" -}}
{{- $pose := .pose | default "salut" -}}
{{- $leve := in (slice "salut" "loupe" "telephone") $pose -}}
<svg class="mascotte mascotte--{{ $pose }} {{ .classe }}" viewBox="0 0 240 220" role="img" aria-label="Ananse, notre mascotte araignée">
  <defs>
    <pattern id="kente-{{ $id }}" width="30" height="18" patternUnits="userSpaceOnUse">
      <rect width="30" height="18" fill="#F2B33D"/>
      <rect x="9" width="5" height="18" fill="#2E8B57"/>
      <rect x="22" width="4" height="18" fill="#D2553A"/>
      <rect y="8" width="30" height="2" fill="#231F1C" opacity=".55"/>
    </pattern>
    <clipPath id="corps-{{ $id }}"><circle cx="120" cy="122" r="58"/></clipPath>
  </defs>

  {{- /* Pattes courtes et arrondies, terminées par des « pieds » ronds : style mascotte, pas araignée réaliste */ -}}
  <g class="m-pattes" fill="none" stroke="#231F1C" stroke-width="9" stroke-linecap="round">
    <path d="M72 100 Q46 80 34 96"/>
    <path d="M66 120 Q38 112 30 130"/>
    <path d="M68 140 Q42 146 40 166"/>
    <path d="M80 160 Q62 178 64 196"/>
    {{- if not $leve }}
    <path d="M168 100 Q194 80 206 96"/>
    {{- end }}
    <path d="M174 120 Q202 112 210 130"/>
    <path d="M172 140 Q198 146 200 166"/>
    <path d="M160 160 Q178 178 176 196"/>
  </g>
  <g fill="#231F1C">
    <circle cx="34" cy="97" r="7"/><circle cx="30" cy="131" r="7"/><circle cx="40" cy="167" r="7"/><circle cx="64" cy="197" r="7"/>
    {{- if not $leve }}<circle cx="206" cy="97" r="7"/>{{ end }}
    <circle cx="210" cy="131" r="7"/><circle cx="200" cy="167" r="7"/><circle cx="176" cy="197" r="7"/>
  </g>

  {{- if $leve }}
  <g class="m-bras">
    <path d="M168 102 Q198 88 200 52" fill="none" stroke="#231F1C" stroke-width="9" stroke-linecap="round"/>
    <circle cx="200" cy="50" r="8" fill="#231F1C"/>
    {{- if eq $pose "loupe" }}
    <line x1="200" y1="46" x2="202" y2="36" stroke="#8a6a3b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="204" cy="20" r="15" fill="#dff3f0" fill-opacity=".8" stroke="#231F1C" stroke-width="5"/>
    <path d="M196 14 q4 -5 10 -4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    {{- else if eq $pose "telephone" }}
    <rect x="187" y="4" width="26" height="44" rx="6" fill="#231F1C"/>
    <rect x="191" y="10" width="18" height="30" rx="2" fill="#F2B33D"/>
    <rect x="194" y="14" width="12" height="3" rx="1.5" fill="#fff" opacity=".85"/>
    <rect x="194" y="20" width="8" height="3" rx="1.5" fill="#fff" opacity=".85"/>
    <rect x="194" y="28" width="12" height="8" rx="2" fill="#2E8B57"/>
    <circle cx="200" cy="50" r="8" fill="#231F1C"/>
    {{- end }}
  </g>
  {{- end }}

  <circle cx="120" cy="122" r="58" fill="#231F1C"/>
  <g clip-path="url(#corps-{{ $id }})">
    <rect x="50" y="76" width="140" height="18" fill="url(#kente-{{ $id }})"/>
    <ellipse cx="88" cy="106" rx="11" ry="6" fill="#fff" opacity=".13" transform="rotate(-30 88 106)"/>
  </g>
  <g class="m-noeud">
    <path d="M60 86 l-16 -8 l4 14 z" fill="url(#kente-{{ $id }})" stroke="#231F1C" stroke-width="2" stroke-linejoin="round"/>
    <path d="M60 88 l-14 10 l14 4 z" fill="url(#kente-{{ $id }})" stroke="#231F1C" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="61" cy="89" r="5" fill="#D2553A" stroke="#231F1C" stroke-width="2"/>
  </g>

  <g class="m-yeux">
    <ellipse cx="99" cy="124" rx="17" ry="20" fill="#fff"/>
    <ellipse cx="141" cy="124" rx="17" ry="20" fill="#fff"/>
    <g class="m-pupilles">
      <circle cx="102" cy="128" r="9" fill="#231F1C"/>
      <circle cx="144" cy="128" r="9" fill="#231F1C"/>
      <circle cx="105" cy="124" r="3.5" fill="#fff"/>
      <circle cx="147" cy="124" r="3.5" fill="#fff"/>
    </g>
  </g>
  <ellipse cx="80" cy="150" rx="8" ry="5" fill="#F28C7A" opacity=".75"/>
  <ellipse cx="160" cy="150" rx="8" ry="5" fill="#F28C7A" opacity=".75"/>
  <path d="M110 152 Q120 162 130 152" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  {{- if eq $pose "ordi" }}
  <g class="m-ordi">
    <rect x="76" y="156" width="88" height="44" rx="6" fill="#3a3330"/>
    <circle cx="120" cy="178" r="7" fill="#F2B33D"/>
    <rect x="62" y="198" width="116" height="9" rx="4.5" fill="#231F1C"/>
  </g>
  {{- end }}
</svg>
