{{ $en := .en }}
<p>{{ cond $en "Pick a message: it appears at the top of the page." "Choisissez un message : il apparaît en haut de la page." }}</p>
<div class="d-rangee">
  <button type="button" class="bouton bouton--petit" data-bandeau="info" data-texte="{{ cond $en "ℹ️ Closed on Monday 11 November. Back on Tuesday!" "ℹ️ Fermeture exceptionnelle lundi 11 novembre. Retour mardi !" }}">ℹ️ {{ cond $en "Closure" "Fermeture" }}</button>
  <button type="button" class="bouton bouton--petit" data-bandeau="promo" data-texte="{{ cond $en "🎁 This week only: 2nd item half price!" "🎁 Cette semaine seulement : le 2ᵉ article à moitié prix !" }}">🎁 Promo</button>
  <button type="button" class="bouton bouton--petit" data-bandeau="urgent" data-texte="{{ cond $en "⚠️ Heat wave: we open at 7 am until Friday." "⚠️ Canicule : nous ouvrons dès 7 h jusqu'à vendredi." }}">⚠️ {{ cond $en "Urgent" "Urgent" }}</button>
</div>
<style>.bandeau-demo{position:sticky;top:64px;z-index:15;display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 44px 10px 16px;font-weight:650;text-align:center}.bandeau-demo button{position:absolute;right:12px;background:none;border:0;color:inherit;font-size:1.1rem;cursor:pointer}.bandeau-demo--info{background:#1F6FB2;color:#fff}.bandeau-demo--promo{background:#F2B33D;color:#231F1C}.bandeau-demo--urgent{background:#C62828;color:#fff}</style>
