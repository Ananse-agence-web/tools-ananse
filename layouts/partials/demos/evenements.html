{{ $en := .en }}
<ul class="evts" data-evts style="list-style:none;padding:0;margin:0;display:grid;gap:10px"></ul>
<style>.evts li{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:start}.evts .date{background:var(--accent);color:var(--sur-accent);border-radius:12px;text-align:center;padding:6px 0;font-weight:800;line-height:1.1}.evts .date small{display:block;font-weight:600;text-transform:uppercase;font-size:.75rem}.evts li.passe{opacity:.5}.evts summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:6px}</style>
