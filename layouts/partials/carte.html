{{- /* Carte d'une démo dans une grille. Paramètre : la page. */ -}}
{{- $id := .Params.fonction -}}
<article class="carte">
  <h3 class="carte__titre"><a href="{{ .RelPermalink }}">{{ .Title }}{{ if .Params.cookies }}<span class="etoile" title="{{ T "tiers" }}">*</span>{{ end }}</a></h3>
  <p class="carte__texte">{{ .Description }}</p>
  <label class="choix choix--petit"><input type="checkbox" data-choix="{{ $id }}"> <span>{{ T "jeveux" }}</span></label>
</article>
