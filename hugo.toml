baseURL = "https://tools.ananse.fr/"
title = "Ce qu'on peut faire avec le web statique"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[taxonomies]
  metier = "metiers"

[markup.goldmark.renderer]
  unsafe = false

[params]
  # E-mail qui reçoit les demandes de devis : data/infos.yaml (modifiable dans /admin/)
  ananse = "https://www.ananse.fr/"

[languages]
  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    title = "Ce qu'on peut faire avec le web statique"
    weight = 1
  [languages.en]
    languageName = "English"
    languageCode = "en-GB"
    title = "What you can do with the static web"
    weight = 2

[outputs]
  home = ["HTML", "JSON"]
