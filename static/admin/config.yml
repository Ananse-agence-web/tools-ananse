# Decap CMS — https://tools.ananse.fr/admin/
# Chaque enregistrement crée un commit sur main : Cloudflare republie le site en 1 à 2 minutes.
backend:
  name: github
  repo: Ananse-agence-web/tools-ananse
  branch: main
  base_url: https://www.ananse.fr
  auth_endpoint: api/auth

locale: fr
site_url: https://tools.ananse.fr
display_url: https://tools.ananse.fr
logo_url: https://tools.ananse.fr/favicon.svg

media_folder: static/img
public_folder: /img

i18n:
  structure: multiple_files
  locales: [fr, en]
  default_locale: fr

collections:
  - name: demos
    label: "Démos (titres et accroches)"
    label_singular: démo
    folder: content/demos
    i18n: true
    create: false
    delete: false
    editor: { preview: false }
    sortable_fields: [weight, title]
    summary: "{{weight}}. {{title}}"
    fields:
      - { name: title, label: Titre, widget: string, i18n: true }
      - { name: description, label: Accroche, widget: text, i18n: true, required: false }
      - { name: slug, widget: hidden, i18n: duplicate, required: false }
      - { name: fonction, widget: hidden, i18n: duplicate, required: false }
      - { name: cat, widget: hidden, i18n: duplicate, required: false }
      - { name: cookies, widget: hidden, i18n: duplicate, required: false }
      - { name: weight, label: "Ordre d'affichage", widget: number, i18n: duplicate, required: false }
      - { name: metiers, widget: hidden, i18n: duplicate, required: false }

  - name: donnees
    label: "Fiches, catégories, métiers"
    editor: { preview: false }
    files:
      - name: fonctions
        label: "Fiches des démos (texte détaillé, services)"
        file: data/fonctions.json
        fields:
          - name: fonctions
            label: Fonctions
            widget: list
            allow_add: false
            summary: "{{id}} — {{fr.titre}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: cat, label: Catégorie, widget: select, options: [contact, reseaux, valeur, contenu, agenda, vendre, resto, asso, immo, bailleur, outils, jeux] }
              - { name: metiers, label: "Métiers", widget: select, multiple: true, options: [tous, restaurant, commerce, immobilier, bailleur, association] }
              - { name: services, label: "Services utilisés", widget: string, required: false }
              - { name: cookies, label: "Dépose des cookies tiers", widget: boolean, default: false }
              - { name: demo, label: Démo, widget: select, options: [{ label: "Réelle", value: reelle }, { label: "Simulée", value: simulee }] }
              - name: fr
                label: Français
                widget: object
                fields:
                  - { name: titre, label: "Titre (sert aux nouvelles démos)", widget: string }
                  - { name: accroche, label: "Accroche (sert aux nouvelles démos)", widget: string }
                  - { name: texte, label: "Texte détaillé", widget: text }
              - name: en
                label: English
                widget: object
                fields:
                  - { name: titre, label: "Title (used for new demos)", widget: string }
                  - { name: accroche, label: "Hook (used for new demos)", widget: string }
                  - { name: texte, label: "Detailed text", widget: text }
      - name: categories
        label: Catégories
        file: data/categories.json
        fields:
          - name: categories
            label: Catégories
            widget: list
            allow_add: false
            summary: "{{emoji}} {{fr}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: emoji, label: Emoji, widget: string }
              - { name: fr, label: Français, widget: string }
              - { name: en, label: English, widget: string }
      - name: metiers
        label: Métiers
        file: data/metiers.json
        fields:
          - name: metiers
            label: Métiers
            widget: list
            allow_add: false
            summary: "{{emoji}} {{fr}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: emoji, label: Emoji, widget: string }
              - { name: fr, label: Français, widget: string }
              - { name: en, label: English, widget: string }

  - name: textes
    label: "Textes du site et infos"
    editor: { preview: false }
    files:
      - name: infos
        label: "Coordonnées (e-mail des devis…)"
        file: data/infos.yaml
        fields:
          - { name: email, label: "E-mail qui reçoit les demandes de devis", widget: string }
          - { name: telephone, label: Téléphone, widget: string, required: false }
          - { name: siret, label: SIRET, widget: string, required: false }
